name: autolearn
description: A generalized AI-powered learning app.

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Local Storage & Security
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI
  cupertino_icons: ^1.0.6

  # Video Player
  youtube_player_flutter: ^9.0.0
  video_player: ^2.9.0

  # HTTP for API calls
  http: ^1.2.0

  # PDF Generation
  pdf: ^3.11.1
  printing: ^5.13.3

  # Storage
  # (Will be replaced with custom API / minio implementation)


  # URL Launcher
  url_launcher: ^6.3.1

  # XML Parsing
  xml: ^6.5.0
  path_provider: ^2.1.2
  file_picker: ^8.0.0+1

  # Date Formatting
  intl: ^0.19.0

  # Charts
  fl_chart: ^0.68.0

  # For AI API integration (you can use OpenAI, Gemini, or custom)
  # Uncomment the one you prefer:
  # openai_dart: ^latest
  # google_generative_ai: ^latest

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  # Add your assets here
  assets:
    - assets/
    - assets/google.png
    - assets/course_content_template.xml

  # Bundled so the app works offline and never calls Google at runtime.
  # Licences: assets/fonts/OFL-*.txt (SIL Open Font License 1.1).
  fonts:
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-400.ttf
          weight: 400
        - asset: assets/fonts/Fraunces-400-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Fraunces-500.ttf
          weight: 500
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-600-italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSans-400-italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/IBMPlexSans-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSans-600-italic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/IBMPlexSans-700.ttf
          weight: 700
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexMono-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-600.ttf
          weight: 600
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-400.ttf
          weight: 400
        - asset: assets/fonts/Caveat-600.ttf
          weight: 600
